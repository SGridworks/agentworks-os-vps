site_name: "AgentWorks AWCP Documentation"
site_description: "AgentWorks Compliance Protocol v0.1 documentation"
site_url: https://sgridworks.github.io/agentworks-os/
repo_url: https://github.com/SGridworks/agentworks-os-vps
nav:
  - Home: index.md
  - "AWCP Spec": awcp/SPEC.md
  - "Install Runbook": install-runbook.md
  - "VPS Blank-Slate Install": vps-blank-slate-install.md
  - "E2E Verification": e2e-verification.md
  - "Rule Pack Authoring": rule-pack-authoring.md
  - "Quickstart": quickstart.md
  - "Disclaimer": disclaimer-text.md
theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
markdown_extensions:
  - admonition
  - footnotes
  - toc:
      permalink: true
